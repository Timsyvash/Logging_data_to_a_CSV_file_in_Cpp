<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Метеостанція</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .chart-container {
            position: relative;
            margin-top: 20px;
            height: 250px;
            width: 100%;
        }

        .file-list {
            margin-top: 25px;
            text-align: left;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .btn-del {
            background: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-dl {
            background: #0275d8;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Метеостанція ESP8266</h1>
        <hr style="margin: 15px 0; border: 0; border-top: 2px solid #ddd;">

        <div class="sensor-info" style="display: flex; justify-content: space-around;">
            <p style="font-size: 18px;">🌡️ Температура: <span id="temp"
                    style="font-weight: bold; color: #d9534f;">--</span> °C</p>
            <p style="font-size: 18px;">💧 Вологість: <span id="humidity"
                    style="font-weight: bold; color: #0275d8;">--</span> %</p>
        </div>

        <!-- Графік -->
        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>

        <!-- Керування файлами -->
        <div class="file-list">
            <h3>📁 Файли у пам'яті (LittleFS)</h3>
            <div id="files-container">Завантаження списку файлів...</div>
        </div>

        <p id="status" style="font-size: 12px; color: #888; margin-top: 20px;">Підключення до метеостанції...</p>
    </div>

    <script>
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Температура (°C)',
                        data: [],
                        borderColor: '#d9534f',
                        backgroundColor: 'rgba(217, 83, 79, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        yAxisID: 'y-temp',
                        fill: true
                    },
                    {
                        label: 'Вологість (%)',
                        data: [],
                        borderColor: '#0275d8',
                        backgroundColor: 'rgba(2, 117, 216, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        yAxisID: 'y-hum',
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false } },
                    'y-temp': { type: 'linear', position: 'left', title: { display: true, text: '°C' } },
                    'y-hum': { type: 'linear', position: 'right', title: { display: true, text: '%' }, grid: { drawOnChartArea: false } }
                }
            }
        });

        const MAX_DATA_POINTS = 20;

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(fetchWeatherData, 2000);
            fetchFilesList();
        });

        function fetchWeatherData() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("temp").innerText = data.temperature.toFixed(1);
                    document.getElementById("humidity").innerText = data.humidity.toFixed(1);
                    document.getElementById("status").innerText = `Аптайм: ${data.uptime} сек | Статус: OK`;

                    const now = new Date().toLocaleTimeString();

                    if (weatherChart.data.labels.length >= MAX_DATA_POINTS) {
                        weatherChart.data.labels.shift();
                        weatherChart.data.datasets[0].data.shift();
                        weatherChart.data.datasets[1].data.shift();
                    }

                    weatherChart.data.labels.push(now);
                    weatherChart.data.datasets[0].data.push(data.temperature);
                    weatherChart.data.datasets[1].data.push(data.humidity);
                    weatherChart.update();
                })
                .catch(err => console.error('Помилка API даних', err));
        }

        function fetchFilesList() {
            fetch('/api/files')
                .then(res => res.json())
                .then(files => {
                    const container = document.getElementById("files-container");
                    if (files.length === 0) {
                        container.innerHTML = "<p>Файлів немає</p>";
                        return;
                    }

                    let html = "";
                    files.forEach(file => {
                        html += `
                            <div class="file-item">
                                <span><b>${file.name}</b> (${file.size} б)</span>
                                <div>
                                    <a class="btn-dl" href="${file.name}" target="_blank">Скачати</a>
                                    ${file.name !== '/index.html' && file.name !== '/style.css' && file.name !== '/app.js' ?
                                `<button class="btn-del" onclick="deleteFile('${file.name}')">Видалити</button>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                })
                .catch(err => {
                    container.innerHTML = "<p style='color:red;'>Помилка завантаження файлів</p>";
                });
        }

        function deleteFile(fileName) {
            if (!confirm(`Ви дійсно хочете видалити файл ${fileName}?`)) return;

            fetch(`/api/file?name=${encodeURIComponent(fileName)}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert("Файл успішно видалено!");
                    fetchFilesList();
                })
                .catch(err => alert("Помилка видалення файлу!"));
        }
    </script>
</body>

</html>
